name: CI
on: [push, pull_request]
jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --coverage=false
      - run: npm run build
      - name: knip (advisory)
        run: npx knip --config knip.json || true
      - run: npm audit --omit=dev
      - name: Prevent duplicate suffixed tracked paths
        run: |
          if git ls-files | grep -E '(^|/)[^/]+ [2-9](\.[^/]+)?($|/)'; then
            echo "Duplicate tracked files or path segments with numbered suffix detected."
            exit 1
          fi
